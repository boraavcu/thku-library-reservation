services:
  # PostgreSQL Servisi
  db:
    image: postgres:16
    container_name: library_reservation_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: library_reservation_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Redis kaldırıldı. Doğrulama kodu, cihaz kilidi ve yoklama PostgreSQL tablolarında durur.
  # Bu dosya yalnızca yerel PostgreSQL içindir; üretim veritabanı ayrıdır.

volumes:
  postgres_data:
