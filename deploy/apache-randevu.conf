# Mevcut *:443 VirtualHost bloğunun İÇİNE ekleyin.
# Sertifika satırlarını buraya yazmayın; onları zaten o VirtualHost tutuyor.
# __FRONTEND_DIST_DIR__ : frontend\dist klasörünün sunucudaki tam yolu (örnek değil, gerçek yol)
# __BACKEND_PORT__      : backend'in yalnızca 127.0.0.1 üzerinde dinlediği boş port
#
# Next.js basePath KULLANILMAZ. Apache /randevu önekini soyup uygulamaya /api/... verir.
# Önek iki kez eklenmez.
#
# ProxyPass eğik çizgi kuralı (iki tarafta da sonda / var):
#   /randevu/api/auth/session
#     -> http://127.0.0.1:__BACKEND_PORT__/api/auth/session
# Kaynak önek /randevu/api/ hedefteki /api/ ile değiştirilir, ardına tekrar /randevu eklenmez.
# Sondaki eğik çizgiyi bir taraftan kaldırıp diğerinde bırakmayın.

# 1) API, SPA yedeğinden önce. Yalnızca /randevu/api/ eşleşir; diğer uygulamalar etkilenmez.
ProxyPreserveHost On
ProxyPass        /randevu/api/ http://127.0.0.1:__BACKEND_PORT__/api/
ProxyPassReverse /randevu/api/ http://127.0.0.1:__BACKEND_PORT__/api/

# 2) Frontend dosyaları dist üzerinden. Vite dev veya preview sunucusu kullanılmaz.
Alias /randevu "__FRONTEND_DIST_DIR__"

<Directory "__FRONTEND_DIST_DIR__">
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    # Var olan dosya (assets, index.html) olduğu gibi gider.
    # /randevu/dashboard gibi yollar index.html olur; sayfa yenileme çalışır.
    # /randevu/api bu dizine düşmez; yukarıdaki ProxyPass onu backend'e bırakır.
    FallbackResource /randevu/index.html
</Directory>

RedirectMatch 301 ^/randevu$ /randevu/
